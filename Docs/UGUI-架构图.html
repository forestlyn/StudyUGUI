function svgElement(tag,attrs={}){const el=document.createElementNS(SVGNS,tag);for(const [k,v]of Object.entries(attrs))el.setAttribute(k,String(v));return el;}
function anchor(n,side){return side==="left"?[n.x,n.y+n.h/2]:side==="right"?[n.x+n.w,n.y+n.h/2]:side==="top"?[n.x+n.w/2,n.y]:[n.x+n.w/2,n.y+n.h];}
function edgeGeometry(e,map){const a=map.get(e.a),b=map.get(e.b);let from=e.from,to=e.to;
 if(!from){if(a.y===b.y){from=a.x<b.x?"right":"left";to=a.x<b.x?"left":"right";}else{from=a.y<b.y?"bottom":"top";to=a.y<b.y?"top":"bottom";}}
 const start=anchor(a,from),end=anchor(b,to);let points;
 if(e.via)points=[start,...e.via,end];else if(start[0]===end[0]||start[1]===end[1])points=[start,end];else{const mid=(start[1]+end[1])/2;points=[start,[start[0],mid],[end[0],mid],end];}
 const midIndex=Math.floor((points.length-1)/2),p=points[midIndex],q=points[midIndex+1];
 const label=e.labelAt||[(p[0]+q[0])/2,(p[1]+q[1])/2-8];
 return {d:points.map((p,i)=>(i?"L":"M")+p.join(",")).join(" "),label};
}

function selectNode(id){const node=active.nodes.find(n=>n.id===id);if(!node)return;selected=id;const d=details[node.key];
 for(const el of graph.querySelectorAll("button.node"))el.setAttribute("aria-pressed",String(el.dataset.id===id));
 for(const el of graph.querySelectorAll(".edge,.edge-label"))el.classList.toggle("dimmed",el.dataset.a!==id&&el.dataset.b!==id);
 document.getElementById("detail-tag").textContent=d.family+" / "+active.tab;document.getElementById("detail-title").textContent=d.title;document.getElementById("detail-body").textContent=d.body;
 document.getElementById("detail-points").innerHTML=d.points.map(p=>"<li>"+escapeHTML(p)+"</li>").join("");
 document.getElementById("detail-sources").innerHTML=d.sources.map(s=>`<div><a href="${ROOT+s.path}#L${s.line}" target="_blank" rel="noopener">${escapeHTML(s.symbol)} · L${s.line} ↗</a><code>${escapeHTML(s.path)}</code></div>`).join("");
 document.getElementById("detail-note").textContent=d.note;
 const hash=active.id+"/"+id;if(location.hash.slice(1)!==hash)history.replaceState(null,"","#"+hash);
}
function setZoom(value){scale=Math.min(1.3,Math.max(.7,value));graph.style.transform=`scale(${scale})`;sizer.style.width=active.width*scale+"px";sizer.style.height=active.height*scale+"px";document.getElementById("zoom").value=Math.round(scale*100);document.getElementById("zoom-value").textContent=Math.round(scale*100)+"%";}
function fitWidth(){setZoom(Math.min(1,(viewport.clientWidth-40)/active.width));}
function showView(id,nodeId){active=views.find(v=>v.id===id)||views[0];document.getElementById("view-title").textContent=active.title;document.getElementById("view-desc").textContent=active.desc;for(const b of tabs.children)b.setAttribute("aria-pressed",String(b.dataset.view===active.id));
 graph.replaceChildren();graph.style.width=active.width+"px";graph.style.height=active.height+"px";renderEdges();
 for(const [y,label]of active.lanes){const el=document.createElement("div");el.className="lane-label";el.style.top=y+"px";el.textContent=label;graph.append(el);}
 for(const n of active.nodes){const b=document.createElement("button");b.type="button";b.className="node "+n.family;b.style.left=n.x+"px";b.style.top=n.y+"px";b.style.width=n.w+"px";b.style.height=n.h+"px";b.dataset.id=n.id;b.setAttribute("aria-pressed","false");b.setAttribute("aria-label",n.title+"："+n.caption+"。查看源码说明");b.innerHTML=`<span class="type">${escapeHTML(details[n.key].family)}</span><strong>${escapeHTML(n.title)}</strong><small>${escapeHTML(n.caption)}</small>`;b.addEventListener("click",()=>selectNode(n.id));graph.append(b);}
 viewport.scrollTop=0;viewport.scrollLeft=0;fitWidth();selectNode(active.nodes.some(n=>n.id===nodeId)?nodeId:active.initial);
}
for(const view of views){const b=document.createElement("button");b.type="button";b.dataset.view=view.id;b.textContent=view.tab;b.setAttribute("aria-pressed","false");b.addEventListener("click",()=>showView(view.id));tabs.append(b);}
document.getElementById("zoom").addEventListener("input",e=>setZoom(Number(e.target.value)/100));document.getElementById("fit").addEventListener("click",fitWidth);
window.addEventListener("hashchange",()=>{const [v,n]=location.hash.slice(1).split("/");if(v!==active.id)showView(v,n);else if(n!==selected)selectNode(n);});
const [startView,startNode]=location.hash.slice(1).split("/");showView(startView,startNode);
// Expose read-only graph metadata for local verification, without external requests.
window.uguiDiagram={views,details,getState:()=>({view:active.id,node:selected,scale})};
</script>
</body>
</html>
